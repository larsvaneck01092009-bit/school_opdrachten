<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Opdracht 9: Concatenatie</h1>
  <p>Open de browserconsole om de drie zinnen en de vergelijking te bekijken.</p>

  <script>

    let naam = "Sarah";
    let score = 450;

    let zin1 = "Welkom " + naam + ", je score is " + score + " punten!";
    let zin2 = "Welkom ".concat(naam, ", je score is ", score, " punten!");
    let zin3 = `Welkom ${naam}, je score is ${score} punten!`;

    console.log(zin1);
    console.log(zin2);
    console.log(zin3);
    console.log("zin1 === zin3:", zin1 === zin3);
  </script>
</body>
</html>
