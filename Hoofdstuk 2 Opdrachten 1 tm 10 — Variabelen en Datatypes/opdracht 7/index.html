<body>
    Kies voor elke situatie let, const of var en leg uit waarom:

De naam van een gebruiker (kan veranderen tijdens het gebruik)
De waarde van PI (3.14159)
Een teller die steeds 1 hoger wordt
Het huidige jaar (verandert niet terwijl het programma draait)
Een score in een game (verandert vaak)
<script>
    // 1. De naam van een gebruiker (kan veranderen tijdens het gebruik)
    let userName = "John Doe";
    // let, omdat de naam kan veranderen.

    // 2. De waarde van PI (3.14159)
    const PI = 3.14159;
    // const, omdat de waarde niet verandert.

    // 3. Een teller die steeds 1 hoger wordt
    let counter = 0;
    // let, omdat de waarde steeds verandert.

    // 4. Het huidige jaar (verandert niet terwijl het programma draait)
    const currentYear = new Date().getFullYear();
    // const, omdat het jaar tijdens het programma niet verandert.

    // 5. Een score in een game (verandert vaak)
    let score = 0;
    // let, omdat de score tijdens het spel verandert.
</script>
</body>
</html>
